<meta charset="utf-8">
<title>Cord House</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --ground: #faf8f4; --raised: #f3ece0; --ink: #22201c; --ink-2: #4a463e;
    --muted: #8a8377; --rule: #ddd6c8; --rule-2: #b8b2a6;
    --accent: #a8631b; --accent-soft: #f0e3d0;
    --pass: #3f7a4a; --fail: #a33a2e; --shadow: rgba(34,32,28,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191713; --raised: #24201a; --ink: #ece6da; --ink-2: #c3bcac;
      --muted: #8f887a; --rule: #332e26; --rule-2: #4a4438;
      --accent: #d99544; --accent-soft: #33291c;
      --pass: #6fa878; --fail: #d4705f; --shadow: rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191713; --raised: #24201a; --ink: #ece6da; --ink-2: #c3bcac;
    --muted: #8f887a; --rule: #332e26; --rule-2: #4a4438;
    --accent: #d99544; --accent-soft: #33291c;
    --pass: #6fa878; --fail: #d4705f; --shadow: rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "IBM Plex Serif", Georgia, "Times New Roman", serif; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lbl { font-size: 9.5px; letter-spacing: 1.3px; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .spacer { margin-left: auto; }
  .row { display: flex; gap: 14px; }
  .col { display: flex; flex-direction: column; }
  .pad { padding: 24px; }

  .shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 22px; padding: 0 24px; height: 54px; flex-shrink: 0; border-bottom: 1.5px solid var(--ink); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -.2px; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 5px 11px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .main { flex-grow: 1; overflow: auto; min-height: 0; }

  .btn { border: 1.5px solid var(--rule-2); padding: 7px 14px; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); transition: border-color .12s, color .12s; }
  .btn:hover { border-color: var(--ink); color: var(--ink); }
  .btn-primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn-primary:hover { color: var(--ground); opacity: .87; }
  .btn-danger:hover { border-color: var(--fail); color: var(--fail); }
  .btn[disabled] { opacity: .35; cursor: not-allowed; }

  .chip { font-size: 9.5px; padding: 2px 7px; border: 1.2px solid var(--rule-2); color: var(--muted); }
  .chip-pass { border-color: var(--pass); color: var(--pass); }
  .chip-fail { border-color: var(--fail); color: var(--fail); }
  .chip-warn { border-color: var(--accent); color: var(--accent); }

  table.grid { border-collapse: collapse; width: 100%; }
  .grid th, .grid td { border-bottom: 1px solid var(--rule); text-align: left; padding: 11px 8px; font-weight: 400; }
  .grid thead th { border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
  .listrow { cursor: pointer; }
  .listrow:hover { background: var(--raised); }

  .cell { width: 100%; height: 34px; border: 1px solid var(--rule); font-size: 10px; letter-spacing: .3px; display: flex; align-items: center; justify-content: center; transition: transform .08s; }
  .cell:hover { transform: scale(1.06); border-color: var(--ink); position: relative; z-index: 1; }
  .k-knows { background: var(--pass); color: var(--ground); border-color: var(--pass); }
  .k-believes { background: var(--accent); color: var(--ground); border-color: var(--accent); }
  .k-suspects { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .k-doubts { color: var(--accent); border-style: dashed; border-color: var(--accent); }
  .k-misbelieves { background: var(--fail); color: var(--ground); border-color: var(--fail); }
  .k-unknown { color: var(--muted); }
  .k-none { background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--rule) 4px, var(--rule) 5px); color: var(--muted); }

  .panel { border: 1.5px solid var(--rule-2); padding: 14px 16px; }
  .panel-accent { border-color: var(--accent); }
  .panel-dashed { border-style: dashed; }

  .fact { border-left: 2.5px solid var(--rule-2); padding-left: 9px; font-size: 11.5px; line-height: 1.5; }
  .fact-knows { border-left-color: var(--pass); }
  .fact-believes, .fact-suspects, .fact-doubts { border-left-color: var(--accent); }
  .fact-misbelieves { border-left-color: var(--fail); }

  .prose { font-family: "IBM Plex Serif", Georgia, serif; font-size: 14.5px; line-height: 1.8; }
  .caret { display: inline-block; width: 2.5px; height: 17px; background: var(--accent); vertical-align: -3px; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .chain { display: flex; align-items: center; }
  .node { width: 9px; height: 9px; background: var(--ink); flex-shrink: 0; }
  .node-open { background: var(--ground); border: 2px solid var(--accent); width: 11px; height: 11px; }
  .link { flex-grow: 1; height: 1.5px; background: var(--rule-2); }

  .scrim { position: fixed; inset: 0; background: var(--shadow); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
  .modal { background: var(--ground); border: 1.5px solid var(--ink); max-width: 620px; width: 100%; max-height: 88vh; overflow: auto; box-shadow: 0 18px 50px var(--shadow); }
  .delta { display: flex; gap: 10px; font-size: 11.5px; line-height: 1.55; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .delta:last-child { border-bottom: none; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 18px; font-size: 12px; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 3v18"/><path d="M9 3v10a3 3 0 0 0 6 0V3"/><path d="M20 3v18"/><path d="M9 17h6"/></svg>
      Cord House
    </div>
    <div id="nav"></div>
    <div class="spacer"></div>
    <div id="topmeta" class="lbl"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="overlay"></div>

<script>
// Every string rendered here is authored in this file. The one value a person
// types -- the project title -- is bound through a DOM property, never through
// markup, so typed text is never parsed as HTML. `paint` is the single place
// where a template becomes nodes, and it only ever receives these literals.
function paint(el, html) {
  el.replaceChildren(document.createRange().createContextualFragment(html));
}

const STATUSES = ["unknown", "suspects", "doubts", "believes", "knows", "misbelieves"];
const VISIBLE = ["knows", "believes", "suspects", "doubts", "misbelieves"];

const FACTS = [
  { id: "cord-limit", text: "The cord of the valley sets a limit on Huanca labour", truth: "ambiguous" },
  { id: "sickness-road", text: "The sickness travels ahead of the runners", truth: "true" },
  { id: "sapa-dead", text: "The Sapa Inca is dead in the north", truth: "true" },
  { id: "recopy-omits", text: "The recopied cord omits the tenth group", truth: "true" },
  { id: "huascar-cusco", text: "Huascar holds Cusco and the fringe", truth: "true" },
  { id: "atahualpa-army", text: "Atahualpa holds the northern army", truth: "true" },
  { id: "wariwillka", text: "Wariwillka was burned by the northern army", truth: "true" },
  { id: "strangers", text: "Strangers with iron came ashore in the north", truth: "true" }
];

const CHARS = [
  { id: "chimpu", name: "Chimpu" },
  { id: "wari", name: "Wari" },
  { id: "ninavilca", name: "Ninavilca" },
  { id: "tupaq", name: "Tupaq" },
  { id: "waman", name: "Waman" }
];

const START = {
  chimpu: { "cord-limit": "unknown", "sickness-road": "knows", "sapa-dead": "knows", "recopy-omits": "knows", "huascar-cusco": "knows", "atahualpa-army": "knows", "wariwillka": null, "strangers": "believes" },
  wari: { "cord-limit": "believes", "sickness-road": null, "sapa-dead": "knows", "recopy-omits": "knows", "huascar-cusco": "knows", "atahualpa-army": "knows", "wariwillka": "knows", "strangers": "knows" },
  ninavilca: { "cord-limit": "doubts", "sickness-road": "knows", "sapa-dead": "knows", "recopy-omits": "knows", "huascar-cusco": "knows", "atahualpa-army": "knows", "wariwillka": null, "strangers": null },
  tupaq: { "cord-limit": null, "sickness-road": null, "sapa-dead": null, "recopy-omits": "knows", "huascar-cusco": null, "atahualpa-army": null, "wariwillka": null, "strangers": null },
  waman: { "cord-limit": "knows", "sickness-road": null, "sapa-dead": null, "recopy-omits": null, "huascar-cusco": null, "atahualpa-army": null, "wariwillka": null, "strangers": null }
};

const PROJECTS = [
  { id: "cord", title: "A Cord For Every Debt", path: "~/projects/a-cord-for-every-debt", chapters: 10, words: "12,138", schema: 3, errors: 0, warnings: 1 },
  { id: "thread", title: "The Unraveled Thread", path: "~/projects/the-unraveled-thread", chapters: 5, words: "2,410", schema: 3, errors: 3, warnings: 2 },
  { id: "harbor", title: "Harbor Of Second Light", path: "~/projects/harbor-of-second-light", chapters: 1, words: "318", schema: 2, errors: 0, warnings: 0 }
];

const DRAFT = "She had the second copy off the frame by the time the light went, and it weighed nothing, which was the part she had not been ready for. Three hundred pendants of somebody else&#8217;s intention and she could carry the whole of it under one arm.";

const S = {
  screen: "projects", project: null, pov: "chimpu",
  knowledge: JSON.parse(JSON.stringify(START)),
  accepted: 10, candidate: "pending", rejected: 0,
  wizard: 0, title: "", modal: null, toast: null, log: []
};

const held = (p) => FACTS.filter((f) => VISIBLE.indexOf(S.knowledge[p][f.id]) >= 0);
const withheld = (p) => FACTS.length - held(p).length;
const nameOf = (id) => CHARS.filter((c) => c.id === id)[0].name;
const q = (s) => "&#39;" + s + "&#39;";

function go(s) { S.screen = s; render(); }

function toast(m) {
  S.toast = m;
  render();
  clearTimeout(window.__t);
  window.__t = setTimeout(function () { S.toast = null; render(); }, 2800);
}

function cycle(c, f) {
  const cur = S.knowledge[c][f];
  const i = cur === null ? -1 : STATUSES.indexOf(cur);
  S.knowledge[c][f] = i + 1 >= STATUSES.length ? null : STATUSES[i + 1];
  render();
}

function doReject() {
  S.candidate = "rejected";
  S.rejected += 1;
  S.log.push("candidate rejected, canon untouched");
  toast("Rejected. Nothing else changed.");
}

function newCandidate() {
  S.candidate = "pending";
  toast("Candidate c-00" + (S.rejected + 1) + " started. Canon is where you left it.");
}

function doAccept() {
  S.accepted += 1;
  S.candidate = "accepted";
  S.knowledge.chimpu["cord-limit"] = "suspects";
  S.modal = null;
  S.log.push("chapter-" + S.accepted + " accepted, snapshot written");
  toast("chapter-" + S.accepted + " is canon. Snapshot written.");
}

function setTitle(v) {
  S.title = v;
  document.getElementById("slug").textContent =
    v.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "...";
  document.getElementById("wnext").disabled = !v;
}

function openProject(id) { S.project = id; go("desk"); }
function setPov(id) { S.pov = id; render(); }
function stepBy(n) { S.wizard += n; render(); }
function openAccept() { S.modal = "accept"; render(); }
function closeModal() { S.modal = null; render(); }
function startWizard() { S.wizard = 1; go("new"); }
function finishWizard(withToast) {
  S.project = "cord";
  go("desk");
  if (withToast) { toast("Created. Opening the desk."); }
}

function navBar() {
  if (!S.project) { return ""; }
  const tabs = [["desk", "Desk"], ["knowledge", "Knowledge"], ["status", "Status"]];
  return '<div class="tabs"><button class="tab" onclick="go(' + q("projects") + ')">&larr; Projects</button>' +
    tabs.map(function (t) {
      return '<button class="tab" aria-current="' + (S.screen === t[0]) + '" onclick="go(' + q(t[0]) + ')">' + t[1] + "</button>";
    }).join("") + "</div>";
}

function projectsScreen() {
  const rows = PROJECTS.map(function (p) {
    const ch = p.id === "cord" ? S.accepted : p.chapters;
    const checks = p.errors
      ? '<span class="chip chip-fail">' + p.errors + " errors</span>"
      : '<span class="chip chip-pass">clean</span>' + (p.warnings ? ' <span class="chip chip-warn">' + p.warnings + " warning</span>" : "");
    return '<tr class="listrow" onclick="openProject(' + q(p.id) + ')">' +
      '<td><div class="serif" style="font-size:15px;font-weight:600">' + p.title + "</div>" +
      '<div style="font-size:10.5px;color:var(--muted);margin-top:3px">' + p.path + "</div></td>" +
      '<td class="num">' + ch + '</td><td class="num">' + p.words + "</td><td>" + checks + "</td>" +
      "<td>" + (p.schema === 2 ? '<span class="chip chip-warn">v2 &middot; migrate</span>' : "v3") + "</td></tr>";
  }).join("");

  return '<div class="pad"><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:20px">' +
    '<div class="serif" style="font-size:20px;font-weight:600">Projects</div><div class="spacer"></div>' +
    '<button class="btn" onclick="toast(' + q("A project is any folder with a story.md in it.") + ')">Open folder</button>' +
    '<button class="btn btn-primary" onclick="startWizard()">+ New project</button></div>' +
    '<table class="grid"><thead><tr><th class="lbl">NOVEL</th><th class="lbl">CHAPTERS</th><th class="lbl">WORDS</th>' +
    '<th class="lbl">CHECKS</th><th class="lbl">SCHEMA</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="panel panel-dashed" style="margin-top:30px;display:flex;gap:14px;align-items:flex-start;max-width:640px">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" style="flex-shrink:0;margin-top:2px">' +
    '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>' +
    '<div style="font-size:11.5px;line-height:1.65;color:var(--ink-2)">A project is a folder of markdown, not a row in a database. ' +
    "Opening one reads it; there is nothing to import and nothing to sync. Delete this app and the novel is still there, still in git.</div></div></div>";
}

function wizardScreen() {
  const step = S.wizard;
  const field = function (l, v) {
    return '<div style="flex:1"><div class="lbl" style="margin-bottom:6px">' + l + "</div>" +
      '<div style="border:1.5px solid var(--rule-2);padding:9px 12px;font-size:13px">' + v + "</div></div>";
  };
  let body = "";

  if (step === 1) {
    body = '<div class="col" style="gap:17px;max-width:540px">' +
      '<div><div class="lbl" style="margin-bottom:6px">TITLE</div>' +
      '<input id="wt" placeholder="Your novel&#8217;s title" oninput="setTitle(this.value)" ' +
      'style="width:100%;border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);padding:10px 12px;' +
      "font-family:'IBM Plex Serif',Georgia,serif;font-size:16px\">" +
      '<div style="font-size:10.5px;color:var(--muted);margin-top:5px">folder: <span id="slug">...</span></div></div>' +
      '<div class="row">' + field("GENRE", "historical fantasy") + field("SETTING ERA", "Tahuantinsuyu, 1524&#8211;1533") + "</div>" +
      '<div class="row">' + field("POV CONTRACT", "third-person-limited") + field("TENSE", "past") + "</div>" +
      '<div><div class="lbl" style="margin-bottom:6px">THEMES</div><div style="display:flex;gap:7px;flex-wrap:wrap">' +
      ["memory", "legitimacy", "reciprocity"].map(function (t) {
        return '<span class="chip" style="border-color:var(--ink);color:var(--ink);font-size:11.5px;padding:4px 11px">' + t + "</span>";
      }).join("") +
      '<span class="chip panel-dashed" style="font-size:11.5px;padding:4px 11px">+ add</span></div></div></div>';
  } else if (step === 2) {
    body = '<div class="col" style="gap:13px;max-width:540px">' +
      '<div style="font-size:12px;line-height:1.7;color:var(--ink-2)">Two is enough to start. The rest arrive as the book does.</div>' +
      [["Chimpu", "protagonist"], ["Robert", "antagonist"]].map(function (c) {
        return '<div style="border:1.5px solid var(--rule-2);padding:10px 13px;display:flex;justify-content:space-between">' +
          '<span class="serif" style="font-size:14px">' + c[0] + '</span>' +
          '<span style="color:var(--muted);font-size:11.5px">' + c[1] + "</span></div>";
      }).join("") +
      '<button class="btn" style="align-self:flex-start">+ Add character</button></div>';
  } else {
    body = '<div class="col" style="gap:15px;max-width:540px">' +
      '<div style="font-size:12.5px;line-height:1.75;color:var(--ink-2)"><strong style="color:var(--ink)">Give the book one secret.</strong> ' +
      "Something true that one character knows and another does not. It takes a minute, and it is the fastest way to see what this is for.</div>" +
      '<div class="panel panel-accent"><div class="serif" style="font-size:15px;font-style:italic">&#8220;Robert killed Elizabeth&#8221;</div>' +
      '<div style="display:flex;gap:22px;margin-top:11px;font-size:12px"><span>Robert <span style="color:var(--pass)">knows</span></span>' +
      '<span>Chimpu <span style="color:var(--muted)">unknown</span></span></div></div>' +
      '<div style="font-size:11px;color:var(--muted);line-height:1.6">Skip it and everything works as it did before. ' +
      "Facts and knowledge stay empty until the book needs them.</div></div>";
  }

  const steps = ["The book", "Who is in it", "A secret"];
  const crumbs = steps.map(function (s, i) {
    const on = i + 1 === step ? "color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:2px" : "";
    return '<span style="' + on + '">' + (i + 1) + " " + s + "</span>" + (i < 2 ? "<span>&#8250;</span>" : "");
  }).join("");

  const controls = (step > 1 ? '<button class="btn" onclick="stepBy(-1)">&#8249; Back</button>' : "") +
    (step < 3
      ? '<button id="wnext" class="btn btn-primary" onclick="stepBy(1)">Next &#8250;</button>'
      : '<button class="btn btn-primary" onclick="finishWizard(1)">Create</button>' +
        '<button class="btn" onclick="finishWizard(0)">Skip</button>') +
    '<span style="font-size:10.5px;color:var(--muted)">' +
    (step === 3 ? "writes story.md, the folders, and snapshot chapter-00" : "nothing is written until you create") + "</span>";

  return '<div class="pad"><div style="display:flex;align-items:center;gap:16px;margin-bottom:22px">' +
    '<div class="serif" style="font-size:20px;font-weight:600">New project</div>' +
    '<div style="display:flex;gap:9px;font-size:11px;color:var(--muted);margin-left:14px">' + crumbs + "</div>" +
    '<div class="spacer"></div><button class="btn" onclick="go(' + q("projects") + ')">Cancel</button></div>' +
    body + '<div style="display:flex;gap:11px;align-items:center;margin-top:26px">' + controls + "</div></div>";
}

function deskScreen() {
  const pov = S.pov;
  const by = function (st) { return held(pov).filter(function (f) { return S.knowledge[pov][f.id] === st; }); };
  const group = function (label, list) {
    if (list.length === 0) { return ""; }
    return '<div><div class="lbl" style="margin-bottom:7px">' + label + '</div><div class="col" style="gap:5px">' +
      list.map(function (f) { return '<div class="fact fact-' + S.knowledge[pov][f.id] + '">' + f.text + "</div>"; }).join("") +
      "</div></div>";
  };

  let chain = "";
  for (let i = 0; i <= S.accepted; i++) {
    chain += '<div class="node' + (i === 0 ? " node-open" : "") + '"></div><div class="link"></div>';
  }
  chain += '<div class="node node-open"></div>';

  const povList = CHARS.slice(0, 3).map(function (c) {
    const on = c.id === pov ? "background:var(--accent-soft);color:var(--accent)" : "color:var(--muted)";
    return '<button style="text-align:left;font-size:11.5px;padding:4px 7px;margin:0 -7px;' + on +
      '" onclick="setPov(' + q(c.id) + ')">' + c.name + "</button>";
  }).join("");

  const disabled = S.candidate !== "pending" ? " disabled" : "";

  return '<div style="display:flex;width:100%;min-height:0">' +

    '<div style="width:172px;border-right:1.5px dashed var(--rule-2);padding:16px 14px;flex-shrink:0" class="col">' +
    '<div class="lbl" style="margin-bottom:11px">CANDIDATES</div><div class="col" style="gap:6px;font-size:11.5px">' +
    (S.rejected ? '<div style="display:flex;justify-content:space-between;color:var(--muted)"><span>c-001</span>' +
      '<span style="color:var(--fail)">rejected</span></div>' : "") +
    '<div style="display:flex;justify-content:space-between;background:var(--raised);margin:0 -7px;padding:4px 7px">' +
    "<span>c-00" + (S.rejected + 1) + '</span><span style="color:' +
    (S.candidate === "accepted" ? "var(--pass)" : "var(--accent)") + '">' +
    (S.candidate === "accepted" ? "accepted" : "pending") + "</span></div></div>" +
    '<div style="height:1px;background:var(--rule);margin:13px 0"></div>' +
    '<div class="lbl" style="margin-bottom:8px">POV</div><div class="col" style="gap:5px">' + povList + "</div>" +
    '<div style="height:1px;background:var(--rule);margin:13px 0"></div>' +
    '<div class="lbl" style="margin-bottom:7px">ARC</div>' +
    '<div style="font-size:11.5px;line-height:1.5">the-strangers<br><span style="color:var(--muted)">sealed v1 &middot; ch 9&#8211;12</span></div></div>' +

    '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">' +
    '<div style="flex-grow:1;padding:22px 26px;overflow:auto">' +
    '<div class="lbl">CHAPTER ' + (S.accepted + 1) + " &middot; POV " + nameOf(pov).toUpperCase() + "</div>" +
    '<div class="serif" style="font-size:17px;font-weight:600;margin:6px 0 16px">The Three Places</div>' +
    '<div class="prose" style="max-width:60ch">' + DRAFT + '<span class="caret"></span></div></div>' +
    '<div style="border-top:1.5px solid var(--ink);padding:11px 26px;display:flex;gap:11px;align-items:center">' +
    (S.candidate === "rejected"
      ? '<button class="btn btn-primary" onclick="newCandidate()">Write another &#8594;</button>' +
        '<span style="font-size:10.5px;color:var(--muted);margin-left:6px">canon is exactly where it was</span>'
      : '<button class="btn btn-danger"' + disabled + ' onclick="doReject()">Reject</button>' +
        '<button class="btn btn-primary"' + disabled + ' onclick="openAccept()">Accept &#8594;</button>' +
        '<span style="font-size:10.5px;color:var(--muted);margin-left:6px">' +
        (S.candidate === "accepted" ? "committed" : "nothing has changed yet") + "</span>") +
    '<div class="spacer"></div><span class="num" style="font-size:11px;color:var(--muted)">1,240 / 2,000</span></div></div>' +

    '<div style="width:330px;border-left:1.5px dashed var(--rule-2);padding:16px 18px;flex-shrink:0;overflow:auto" class="col">' +
    '<div class="panel panel-accent" style="display:flex;align-items:center;gap:9px;margin-bottom:15px">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" style="flex-shrink:0">' +
    '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
    '<path d="m1 1 22 22"/></svg><div style="font-size:12px;font-weight:500;color:var(--accent)">' +
    '<span class="num">' + withheld(pov) + "</span> fact" + (withheld(pov) === 1 ? "" : "s") + " withheld from this POV</div></div>" +
    '<div class="col" style="gap:15px">' +
    group("KNOWS", by("knows")) + group("BELIEVES", by("believes")) +
    group("SUSPECTS / DOUBTS", by("suspects").concat(by("doubts"))) + group("MISBELIEVES", by("misbelieves")) +
    '<div><div class="lbl" style="margin-bottom:7px">MUST NOT HAPPEN</div>' +
    '<div class="panel panel-dashed" style="border-color:var(--fail);font-size:11.5px;line-height:1.5;color:var(--fail)">' +
    nameOf(pov) + " must not learn, infer, or be told anything beyond the knowledge listed here.</div></div>" +
    '<div style="font-size:10.5px;color:var(--muted);line-height:1.55">The redaction is visible as a redaction. ' +
    "You see that something is missing, never what.</div></div>" +
    '<div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)">' +
    '<div class="lbl" style="margin-bottom:9px">STATE CHAIN</div><div class="chain">' + chain + "</div>" +
    '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:5px">' +
    '<span>00</span><span class="num" style="color:var(--accent)">' + (S.accepted + 1) + " drafting</span></div></div></div></div>";
}

function knowledgeScreen() {
  const legend = [["k-knows", "knows"], ["k-believes", "believes"], ["k-suspects", "suspects"], ["k-doubts", "doubts"],
    ["k-misbelieves", "misbelieves"], ["k-unknown", "unknown"], ["k-none", "no record"]];

  const rows = FACTS.map(function (f) {
    const cells = CHARS.map(function (c) {
      const st = S.knowledge[c.id][f.id];
      return '<td style="padding:4px"><button class="cell k-' + (st || "none") +
        '" onclick="cycle(' + q(c.id) + "," + q(f.id) + ')">' + (st || "&#8212;") + "</button></td>";
    }).join("");
    return '<tr><td style="font-size:12px;line-height:1.45">' + f.text + "</td>" +
      '<td><span class="chip ' + (f.truth === "true" ? "chip-pass" : "chip-warn") + '">' + f.truth + "</span></td>" + cells + "</tr>";
  }).join("");

  const tallies = CHARS.map(function (c) {
    return '<div class="panel" style="min-width:136px"><div style="font-size:12px;font-weight:600;margin-bottom:5px">' + c.name + "</div>" +
      '<div class="num" style="font-size:11.5px;color:var(--muted)">holds ' + held(c.id).length +
      ' &middot; <span style="color:var(--accent)">withheld ' + withheld(c.id) + "</span></div></div>";
  }).join("");

  return '<div class="pad"><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:6px">' +
    '<div class="serif" style="font-size:20px;font-weight:600">Knowledge</div>' +
    '<div style="font-size:11.5px;color:var(--muted)">click any cell to change what that character holds</div></div>' +
    '<div style="font-size:11.5px;color:var(--ink-2);max-width:66ch;line-height:1.65;margin-bottom:20px">' +
    "The rows are what is <em>true</em>. The cells are what each person <em>holds</em>. Keeping those apart is the whole engine &#8212; " +
    "a hatched cell is no record at all, which the projection treats as not knowing.</div>" +
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;font-size:10px">' +
    legend.map(function (l) { return '<span class="cell ' + l[0] + '" style="width:auto;height:22px;padding:0 9px">' + l[1] + "</span>"; }).join("") +
    "</div>" +
    '<div style="overflow-x:auto"><table class="grid" style="min-width:780px"><thead><tr>' +
    '<th class="lbl" style="width:38%">FACT</th><th class="lbl">TRUTH</th>' +
    CHARS.map(function (c) { return '<th class="lbl" style="text-align:center">' + c.name.toUpperCase() + "</th>"; }).join("") +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
    '<div style="display:flex;gap:14px;margin-top:22px;flex-wrap:wrap">' + tallies + "</div></div>";
}

function statusScreen() {
  const tick = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pass)" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>';
  const check = function (n, w) {
    return '<div class="panel" style="border-color:var(--pass);flex:1"><div style="display:flex;align-items:center;gap:8px">' + tick +
      '<span style="font-size:13px;font-weight:600;color:var(--pass)">' + n + "</span></div>" +
      '<div class="num" style="font-size:11px;color:var(--ink-2);margin-top:5px">0 errors &middot; ' + w + " warnings</div></div>";
  };

  const orphans = FACTS.filter(function (f) {
    return !CHARS.some(function (c) { return VISIBLE.indexOf(S.knowledge[c.id][f.id]) >= 0; });
  }).length;

  const obligations = [
    ["Chimpu will read the tenth group", "planted ch-01, " + S.accepted + " chapters open", "accent"],
    ["What does the tenth group say", "question, open", "muted"],
    ["Who ordered the tenth group left out", "question, open", "muted"],
    ["The valley will be made to choose a side", "paid ch-08", "pass"]
  ].map(function (o) {
    return '<tr><td style="width:9px;padding-right:0"><div style="width:7px;height:7px;background:var(--' + o[2] + ')"></div></td>' +
      '<td style="font-size:12px">' + o[0] + '</td><td style="font-size:10.5px;color:var(--' +
      (o[2] === "pass" ? "pass" : "muted") + ');text-align:right">' + o[1] + "</td></tr>";
  }).join("");

  const arcs = [["the-silent-cords", "ch 1&#8211;4", "sealed v1", 0], ["the-two-incas", "ch 5&#8211;8", "unsealed", 0],
    ["the-strangers", "ch 9&#8211;12", "active", 1]].map(function (a) {
    return '<div style="display:flex;gap:11px;align-items:center"><span style="flex-grow:1;' +
      (a[3] ? "color:var(--accent)" : "") + '">' + a[0] + '</span><span style="color:var(--muted)">' + a[1] + "</span>" +
      '<span class="chip' + (a[3] ? " chip-warn" : "") + '">' + a[2] + "</span></div>";
  }).join("");

  const entries = CHARS.reduce(function (n, c) {
    return n + FACTS.filter(function (f) { return S.knowledge[c.id][f.id]; }).length;
  }, 0);

  const sessionLog = S.log.length
    ? '<div style="margin-top:16px"><div class="lbl" style="margin-bottom:8px">THIS SESSION</div>' +
      '<div class="col" style="gap:5px;font-size:10.5px;color:var(--muted)">' +
      S.log.map(function (l) { return "<div>" + l + "</div>"; }).join("") + "</div></div>"
    : "";

  return '<div class="pad"><div class="row" style="margin-bottom:22px">' +
    check("validate", 9) + check("links", 0) + check("continuity", 1) + "</div>" +
    '<div class="row" style="gap:26px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1 1 380px;min-width:0">' +
    '<div class="lbl" style="margin-bottom:11px">OPEN OBLIGATIONS</div><table class="grid"><tbody>' + obligations + "</tbody></table>" +
    '<div class="lbl" style="margin:20px 0 11px">ARCS</div><div class="col" style="gap:9px;font-size:11.5px">' + arcs + "</div></div>" +
    '<div style="flex:0 1 300px"><div class="panel" style="margin-bottom:14px">' +
    '<div class="lbl" style="margin-bottom:9px">KNOWLEDGE COVERAGE</div><div class="col num" style="gap:7px;font-size:11.5px">' +
    '<div style="display:flex;justify-content:space-between"><span>facts</span><span>' + FACTS.length + "</span></div>" +
    '<div style="display:flex;justify-content:space-between"><span>characters tracked</span><span>' + CHARS.length + " of " + CHARS.length + "</span></div>" +
    '<div style="display:flex;justify-content:space-between"><span>epistemic entries</span><span>' + entries + "</span></div>" +
    '<div style="display:flex;justify-content:space-between;color:' + (orphans ? "var(--accent)" : "var(--muted)") + '">' +
    "<span>facts nobody holds</span><span>" + orphans + "</span></div></div></div>" +
    '<div class="panel panel-dashed panel-accent" style="display:flex;gap:10px;align-items:flex-start">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" style="flex-shrink:0;margin-top:2px">' +
    '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>' +
    '<div style="font-size:11px;line-height:1.6;color:var(--accent)"><strong>1 warning.</strong> ' +
    "A hard constraint in the-silent-cords expires at chapter-12, which is not written yet. Expected while the arc is open.</div></div>" +
    sessionLog + "</div></div></div>";
}

function acceptModal() {
  const n = S.accepted + 1;
  const d = function (sign, label, detail) {
    return '<div class="delta"><span style="color:var(--pass);flex-shrink:0">' + sign + "</span>" +
      "<div><div>" + label + '</div><div style="color:var(--muted);font-size:10.5px;margin-top:2px">' + detail + "</div></div></div>";
  };

  return '<div class="scrim" onclick="if(event.target===this){closeModal()}"><div class="modal">' +
    '<div style="padding:20px 24px;border-bottom:1.5px solid var(--ink)">' +
    '<div class="serif" style="font-size:18px;font-weight:600">Accept chapter-' + n + "</div>" +
    '<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Everything below commits together, or nothing does.</div></div>' +
    '<div style="padding:16px 24px"><div class="lbl" style="margin-bottom:8px">WILL BE WRITTEN</div>' +
    d("+", "chapters/chapter-" + n + ".md", "prose becomes canon, body 4f21c9be") +
    d("+", "continuity/state/chapter-" + n + ".md", "snapshot " + n + ", carrying snapshot " + S.accepted + " forward") +
    d("~", "continuity/knowledge/chimpu.md", "cord-limit: unknown &#8594; suspects, learned-in chapter-" + n) +
    d("~", "plot/timeline.md", "one row appended") +
    d("+", "transactions/chapter-" + n + ".json", "the receipt, with the prose hash") +
    '<div class="panel panel-dashed" style="margin-top:16px;font-size:11px;line-height:1.6;color:var(--ink-2)">' +
    "If any one of these writes fails, the ones already made are rolled back. There is no half-accepted chapter.</div></div>" +
    '<div style="padding:14px 24px;border-top:1px solid var(--rule);display:flex;gap:11px;align-items:center">' +
    '<button class="btn btn-primary" onclick="doAccept()">Commit</button>' +
    '<button class="btn" onclick="closeModal()">Cancel</button>' +
    '<span style="font-size:10.5px;color:var(--muted);margin-left:4px">nothing is written until you commit</span></div></div></div>';
}

function render() {
  const screens = {
    projects: projectsScreen, new: wizardScreen, desk: deskScreen,
    knowledge: knowledgeScreen, status: statusScreen
  };

  paint(document.getElementById("nav"), navBar());
  document.getElementById("topmeta").textContent = S.project ? S.accepted + " chapters · 12,138 words" : "";

  const main = document.getElementById("main");
  paint(main, (screens[S.screen] || projectsScreen)());
  main.style.display = S.screen === "desk" ? "flex" : "block";

  paint(document.getElementById("overlay"),
    (S.modal === "accept" ? acceptModal() : "") + (S.toast ? '<div class="toast"></div>' : ""));
  if (S.toast) { document.querySelector(".toast").textContent = S.toast; }

  const wt = document.getElementById("wt");
  if (wt) {
    wt.value = S.title;
    document.getElementById("wnext").disabled = !S.title;
    wt.focus();
  }
}

render();
</script>
